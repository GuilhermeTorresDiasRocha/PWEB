<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Criação de Objetos em JS</title>
</head>
<body>
    <script>
        var aluno1 = new Object();
        aluno1.ra = "00001234";
        aluno1.nome = "Ju Venal";
        alert(`RA = ${aluno1.ra}\nNome = ${aluno1.nome}`);

        var aluno2 = {};
        aluno2.ra = "1234"
        aluno2["nome"] = "Ro Berval";
        aluno2["email do aluno"] = "ro.berval@vendedor.jornal";
        alert("RA = " + aluno2.ra + "\nNome = " + aluno2.nome + "\nemail = " + aluno2["email do aluno"]);

        var aluno3 = { //literal
            ra: "1234567",
            nome: "Marcus", //ultima virgula opcional
        };
        alert("RA = " + aluno3.ra + " \nNome = " + aluno3.nome);

        function Aluno(ra, nome){
            this.ra = ra;
            this.nome = nome;
            this.MostraDados = function(){
                return "RA = " +this.ra + "\nNome = " + this.nome;
            }
        }
        aluno4 = new Aluno("98765", "Bráulio");
        alert(aluno4.MostraDados());
        alert(aluno4.nome);

        function Aluno2(){
            var ra;
            var nome;

            this.setRA = function(value){
                this.ra = value;
            }
            this.getRA = function(){
                return this.ra;
            }

            this.setNome = function(value){
                this.nome = value;
            }
            this.getNome = function(){
                return this.nome;
            }
        }
        var aluno5 = new Aluno2();
        aluno5.setRA("945676");
        aluno5.setNome("123 de Oliveira 4");
        alert("RA = " + aluno5.getRA() + "\nNome = " + aluno5.getNome());

        function AlunoADS(){
            var numLab;
            this.setNumLab = function(value){
                this.numLab = value;
            }

            this.getNumLab = function(){
                return this.numLab;
            }
        }
        //herança
        AlunoADS.prototype = new Aluno2();
        var aluno6 = new AlunoADS();
        aluno6.setRA("85495498");
        aluno6.setNome("Creusa");
        aluno6.setNumLab(5);
        alert("RA = " + aluno6.getRA() + "\nNome = " + aluno6.getNome() + "\nNum LAB = " + aluno6.getNumLab());

        class Aluno1{
            constructor(){
                this._ra;
                this._nome;
            }

            setNome(value){
                this._nome = value;
            }
            getNome(){
                return this._nome;
            }

            setRA(value){
                this._ra = value;
            }
            getRA(){
                return this._ra;
            }
        }
        var aluno7 = new Aluno1();
        aluno7.setRA('875897');
        aluno7.setNome("Crovis");
        alert("RA = " + aluno7.getRA() + "\nNome = " + aluno7.getNome());

        class AlunoADS1 extends Aluno1{
            constructor(){
                super();
                this._numLab;
            }
            setNumLab(value){
                this._numLab = value;
            }
            getNumLab(){
                return this._numLab;
            }
        }

        var aluno8 = new AlunoADS1();
        aluno8.setRA("94878");
        aluno8.setNome("Josiscleide");
        aluno8.setNumLab("8");
        alert("RA = " + aluno8.getRA() + "\nNome = " + aluno8.getNome() + "\nNum LAB = " + aluno8.getNumLab());

        //Copia de objetos
        var obj1 = new Object();
        var obj2 = obj1;
        obj1.nome = "Vrauzio";
        alert(obj2.nome); //Vrauzio

        class ContaBancaria{
            #cpf; //privado

            constructor(nome, saldoInicial){
                this.nome = nome;
                this.saldo = saldoInicial;
            }

            setCPF(value){
                this.cpf = value;
            }

            getCPF(){
                return this.cpf;
            }

            getNome(){
                return this.nome;
            }

            getSaldo(){
                return this.saldo;
            }

            depositar(valor){
                this.saldo+= valor;
                this.#registrarTransacao(valor);
            }

            #registrarTransacao(valor){
                console.log(`Depósito de R$${valor}\nSaldo R$${this.saldo} para CPF: ${this.getCPF()}`);
            }
        }

        const conta1 = new ContaBancaria("Braulio", 1000);
        conta1.setCPF('78538974897');
        conta1.depositar(50);

        const arr = [
            ['codigo', 1],
            ['nome', 'Juãum'],
            ['idade', 23],
        ];

        const obj = Object.fromEntries(arr);
        alert(obj);
        alert(obj.nome);
        alert(JSON.stringify(obj));

        const objEmpresa = {
            empresa: 'ZF do Brasil'
        };

        const funcionario =
            Object.create(objEmpresa, {
                nome:{
                    value: "Serjo"
                },
                endereco:{
                    value: 'Av. São Paulo'
                },
            });
        console.log("funcionario.empresa");
        console.log(funcionario.nome);
        console.log(funcionario.endereco);

        const objNovaEmpresa = {
            empresa: 'ZF do Brasil'
        };
        const objVeiculo = {
            placa: 'XXX 1234'
        };
        const motorista = Object.assign({
            cpf: '123'
        }, objNovaEmpresa, objVeiculo);
        console.log(motorista);
    </script>
</body>
</html>
